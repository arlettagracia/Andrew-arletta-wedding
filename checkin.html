<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Wedding Check-In
    </title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #f7f1e8,
                    #fffaf4
                );

            font-family:
                Georgia,
                serif;

            color: #5d4935;

        }


        .checkin-container {

            width: 90%;

            max-width: 450px;

            padding: 35px 25px;

            text-align: center;

            background: rgba(
                255,
                255,
                255,
                0.9
            );

            border:
                1px solid
                rgba(
                    184,
                    148,
                    82,
                    0.35
                );

            box-shadow:
                0 15px 40px
                rgba(
                    80,
                    60,
                    35,
                    0.12
                );

        }


        .subtitle {

            font-size: 10px;

            letter-spacing: 4px;

            color: #a17b42;

        }


        h1 {

            margin-top: 10px;

            font-weight: normal;

        }


        #reader {

            width: 100%;

            margin:
                25px auto;

        }


        .result {

            margin-top: 20px;

            padding: 20px;

            display: none;

        }


        .result.active {

            display: block;

        }


        .success {

            background: #f1f6ed;

            border:
                1px solid
                #c8d8bd;

        }


        .error {

            background: #faf0ed;

            border:
                1px solid
                #dfc0b7;

        }


        .guest-name {

            font-size: 25px;

            margin: 10px 0;

        }


        .checkin-button {
            /* ========================================
   TOMBOL SCAN BERIKUTNYA
======================================== */

.scan-again-button {
    margin-top: 25px;
    padding: 13px 28px;

    border: none;
    border-radius: 30px;

    background: #8f6e38;
    color: white;

    font-family: Georgia, serif;
    font-size: 15px;

    cursor: pointer;

    transition: 0.3s;
}

.scan-again-button:hover {
    background: #6f542b;
    transform: translateY(-2px);
}


/* ========================================
   HASIL CHECK-IN
======================================== */

.checkin-success {
    padding: 25px 15px;
    border-radius: 15px;

    background: #f5f8f1;
    border: 1px solid #d4dfc9;

    animation: fadeIn 0.5s ease;
}

.checkin-warning {
    padding: 25px 15px;
    border-radius: 15px;

    background: #fbf5eb;
    border: 1px solid #e2cda5;

    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

            margin-top: 20px;

            padding: 12px 25px;

            border: none;

            background: #8f6e38;

            color: white;

            cursor: pointer;

        }

    </style>

</head>


<body>


<div class="checkin-container">

    <div class="subtitle">
        ANDREW & ARLETTA
    </div>

    <h1>
        Wedding Check-In
    </h1>

    <p>
        Scan QR Code Tamu
    </p>


    <div id="reader"></div>


    <div
        id="result"
        class="result"
    >

        <div id="resultMessage"></div>

<button
    id="scanAgainButton"
    class="scan-again-button"
    style="display:none;"
    onclick="scanAgain()"
>
    Scan Tamu Berikutnya
</button>

    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="checkin.js?v=3"></script>

</body>
<h3 style="color:red;">
    TEST CHECK-IN HTML
</h3>
</html>
